# NSE may block GitHub-hosted runner IPs (403). If this fails with "blocking this
# client", run `python -m fii_fetcher flows` locally after market close and push.
name: Fetch daily FII/DII flows

on:
  schedule:
    # Mon-Fri 13:30 UTC (19:00 IST): NSE posts provisional figures after the close.
    - cron: "30 13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-flows
  cancel-in-progress: false

jobs:
  flows:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fetcher/requirements.txt
      - run: pip install -r fetcher/requirements.txt
      - name: Test
        working-directory: fetcher
        run: python -m unittest discover -s tests
      - name: Fetch flows
        working-directory: fetcher
        run: python -m fii_fetcher flows
      - name: Commit data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data/flows.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: daily FII/DII flows $(date -u +%F)"
            git push
          fi

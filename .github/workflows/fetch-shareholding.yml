# Optional: NSE often blocks GitHub-hosted runner IPs (403). If this job fails
# with "blocking this client", run the fetcher locally instead (see README) and
# push the data yourself.
name: Fetch FPI shareholding

on:
  schedule:
    # Mondays 03:30 UTC (09:00 IST). Filings are due 21 days after quarter end,
    # so weekly is plenty and keeps load on NSE minimal.
    - cron: "30 3 * * 1"
  workflow_dispatch:
    inputs:
      limit:
        description: "Only the first N stocks (blank = all)"
        required: false
      quarters:
        description: "Quarters per stock"
        required: false
        default: "4"

permissions:
  contents: write

# Same group as fetch-daily.yml, so the two never push at the same moment.
concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fetcher/requirements.txt

      - name: Install
        run: pip install -r fetcher/requirements.txt

      - name: Test
        working-directory: fetcher
        run: python -m unittest discover -s tests

      - name: Fetch
        working-directory: fetcher
        env:
          LIMIT: ${{ inputs.limit }}
          QUARTERS: ${{ inputs.quarters || '4' }}
        run: |
          args=(all --quarters "$QUARTERS")
          if [ -n "$LIMIT" ]; then args+=(--limit "$LIMIT"); fi
          python -m fii_fetcher "${args[@]}"

      - name: Commit data
        if: always()
        run: .github/scripts/commit-data.sh "data: FPI shareholding update $(date -u +%F)" web/public/data/holdings web/public/data/summary.json web/public/data/universe.json
